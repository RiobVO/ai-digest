<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@800;900&display=block">
<style>
/* Картинка 1200×630 для превью ссылки в Telegram — в том же наборе, что обложка страницы (design/REDESIGN.md):
   бумага, дата цветом дня, заголовок. Тема всегда дневная: картинку смотрят в ленте чата, а не на странице */
html,body{margin:0}
body{position:relative;box-sizing:border-box;width:1200px;height:630px;overflow:hidden;display:grid;align-content:end;padding:48px 60px;
  background:#f1ede4;color:#151515;font-family:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;-webkit-font-smoothing:antialiased}
/* Правый верхний угол крупного превью Telegram закрывает своей кнопкой-лупой: там только круги сигнала */
.rings{position:absolute;right:-240px;top:-390px;width:984px;color:$mood;overflow:visible}
.rings circle{fill:none;stroke:currentColor;stroke-width:.3;opacity:.34}
.rings .dot{fill:currentColor;stroke:none;opacity:1}
b{position:relative;display:block;font-weight:900;font-size:372px;line-height:.76;letter-spacing:-.025em;color:$mood;font-variant-numeric:tabular-nums}
/* Превью в Telegram на телефоне ужимает картинку до ~400px: заголовок крупный и не длиннее трёх строк */
h1{position:relative;margin:29px 0 0;font-weight:800;font-size:76px;line-height:.93;text-transform:uppercase;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<svg class="rings" viewBox="0 0 100 100" aria-hidden="true"><circle class="dot" cx="50" cy="50" r="1.6"/><circle cx="50" cy="50" r="6"/><circle cx="50" cy="50" r="11"/><circle cx="50" cy="50" r="16"/><circle cx="50" cy="50" r="21"/><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="31"/><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="41"/><circle cx="50" cy="50" r="46"/></svg>
<b>$date</b>
<h1>$headline</h1>
</body>
</html>
