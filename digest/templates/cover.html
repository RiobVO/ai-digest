<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block">
<style>
/* Обложка 1200×630 для превью ссылки: палитра, знак и пейзаж — те же, что у страницы выпуска */
:root{--bg:#fefcf5;--ink:#2f2d2c;--ink-2:#4f4b47;--muted:#6e6963;--chip:#ece7dd;--blue:hsl(218 100% 57%)}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;color:var(--ink);-webkit-font-smoothing:antialiased;
  font-family:"Inter",-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(100deg,rgba(254,252,245,.97) 0%,rgba(254,252,245,.8) 45%,rgba(254,252,245,0) 80%),
    $landscape center/cover no-repeat,var(--bg)}
.card{box-sizing:border-box;height:630px;padding:60px 72px 56px;display:grid;grid-template-rows:auto 1fr auto;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:56px;height:56px;color:var(--blue)}
.brand b{display:block;font-size:40px;font-weight:600;letter-spacing:-.025em;line-height:1}
.brand small{display:block;margin-top:6px;font-size:20px;font-weight:500;color:var(--muted)}
.date{background:var(--chip);border-radius:10px;padding:10px 18px;font-size:22px;font-weight:600;white-space:nowrap}
/* Превью в Telegram на телефоне ужимает картинку до ~400px: заголовок крупный и не длиннее трёх строк */
h1{align-self:center;margin:0;max-width:960px;font-size:64px;font-weight:500;line-height:1.12;letter-spacing:-.022em;
  text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:24px;color:var(--ink-2);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".2"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".45"/><circle cx="16" cy="16" r="4.6" fill="currentColor"/></svg><div><b>сигнал</b><small>ИИ-дайджест</small></div></div>
    <span class="date">$date</span>
  </div>
  <h1>$headline</h1>
  <div class="sub">$sub</div>
</div>
</body>
</html>
