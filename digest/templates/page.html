<!doctype html>
<html lang="ru" data-mood="$mood">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$headline · ИИ-дайджест</title>
<meta name="description" content="$description">
<meta property="og:type" content="article">
<meta property="og:site_name" content="сигнал · ИИ-дайджест">
<meta property="og:title" content="$headline">
<meta property="og:description" content="$description">$og_image
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='none' stroke='%232474ff' stroke-width='1.8' opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%232474ff' stroke-width='2' opacity='.6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232474ff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Сигнал">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f1ede4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<!-- Выбранная вручную тема применяется до отрисовки, иначе ночью страница мигнула бы светлой бумагой -->
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){/* хранилище закрыто — остаётся системная тема */}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap">
<style>
/* Выпуск — лента плакатов в одном наборе: бумага, чёрный текст и один цвет-акцент (design/REDESIGN.md).
   Акцент — цвет дня (digest/mood.py): им набраны дата на обложке, круги прогресса и мелкие метки. Ночью бумага чёрная.
   Дата с обложки при прокрутке сжимается и встаёт в шапку; круги в шапке — новости выпуска, прочитанные закрашены.
   Вся разметка статична: без скрипта страница читается целиком, скрипт добавляет шапку, лист разбора и отметки. */
:root{
  color-scheme:light;
  --paper:#f1ede4; --ink:#151515;
  --line:color-mix(in srgb,var(--ink) 22%,transparent);
  --f-display:"Sofia Sans Extra Condensed","Oswald","Arial Narrow",sans-serif;
  --f-text:"Golos Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark; --paper:#0c0c0e; --ink:#ece8df}
}
:root[data-theme="dark"]{color-scheme:dark; --paper:#0c0c0e; --ink:#ece8df}
$mood_css

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html.locked{overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid currentColor;outline-offset:3px}
button{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}

/* Шапка: появляется, когда обложка уходит; место слева занимает прилетевшая дата. Нажатие открывает содержание */
#hdr{position:fixed;inset:0 0 auto;z-index:6;padding-top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:3px solid var(--ink);
  transform:translateY(-102%);will-change:transform}
.hdr-in{display:flex;align-items:center;gap:12px;width:100%;height:50px;max-width:1120px;margin-inline:auto;border:0;background:none;text-align:left;cursor:pointer;
  padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
  font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#hdr-date{flex:none;width:var(--date-w,84px);height:27px}
#hdr-sec{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{flex:none;display:flex;align-items:center;gap:10px}
#fly{display:none;position:fixed;left:0;top:0;z-index:7;transform-origin:0 0;pointer-events:none;white-space:nowrap;will-change:transform;
  font:900 var(--date-size,clamp(9rem,47vw,24rem))/.76 var(--f-display);letter-spacing:-.025em;color:var(--mood);font-variant-numeric:tabular-nums}
#fly span{display:block}
.fly #fly{display:block}
.fly .cover .ph{visibility:hidden}

/* Круги прогресса: новости выпуска изнутри наружу */
.prog{display:block;width:30px;height:30px;overflow:visible}
.prog circle{fill:none;stroke:var(--ink);stroke-width:.5;opacity:.4;transition:stroke .3s,stroke-width .4s,opacity .3s}
.prog circle.on{stroke:var(--mood);stroke-width:1.5;opacity:1}
.end .prog{width:min(62vw,340px);height:auto}
.end .prog circle.on{stroke-width:1}
/* В шапке значок мал: непрочитанные круги не рисуем, остаётся пустой контур, который заполняется от центра */
#hdr .prog circle{opacity:0}
#hdr .prog circle:last-child{opacity:.45;stroke-width:.9}
#hdr .prog circle.on{opacity:1;stroke-width:1.5}

/* Плакат */
.slide{position:relative;display:grid;min-height:100svh;overflow:clip;background:var(--paper);color:var(--ink)}
.inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;width:100%;max-width:1120px;margin-inline:auto;
  padding-block:calc(69px + env(safe-area-inset-top,0px)) 20px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.cover .inner{padding-top:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px;padding-bottom:8px;border-bottom:3px solid currentColor;
  font:500 .74rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.content{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:auto}
/* Новости идут лентой. Номер новости — маленький индекс перед заголовком, отдельного места не занимает */
.st,.blk{min-height:0;border-top:1px solid var(--line)}
.st .inner,.blk .inner{padding-block:calc(74px + env(safe-area-inset-top,0px)) 44px}
.st .content,.blk .content{margin-top:0}
.idx{display:inline-block;position:relative;top:.5em;margin-right:.55em;vertical-align:top;font:500 .27em/1 var(--f-mono);letter-spacing:.04em;opacity:.6}
.hl{margin:0;font:800 clamp(2.35rem,10.6vw,5.4rem)/.93 var(--f-display);text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;font:400 .72rem/1.6 var(--f-mono);opacity:.8}
.meta>*{white-space:nowrap}
.meta>.also{white-space:normal}
/* inline-block: иначе точка-разделитель после ссылки HN была бы подчёркнута вместе с ней */
.meta>:not(:last-child)::after{content:"·";display:inline-block;margin-left:10px}
/* Значок издания на белой плашке: тёмные значки не пропадают на ночном фоне */
.fav{width:14px;height:14px;margin-right:6px;border-radius:3px;background:#fff;vertical-align:-2px}
.thread{display:grid;gap:6px;justify-items:start;font:500 .9rem/1.4 var(--f-text)}
.tag{display:inline-flex;align-items:center;min-height:34px;padding:0 10px;border:1.5px solid currentColor;background:none;
  font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}
span.tag{cursor:default}
/* Прошлые дни сюжета лежат в разметке; со скриптом они показываются листом, а не под меткой */
.js .thread .tl{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.body{margin:0;max-width:60ch;font:400 1.03rem/1.5 var(--f-text);text-wrap:pretty}
.side{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
/* Вывод крупно и раньше подробностей: это самая полезная строка новости */
.why{margin:0;padding-top:12px;border-top:1.5px solid currentColor;max-width:38ch;font:500 clamp(1.25rem,5vw,1.6rem)/1.3 var(--f-text);text-wrap:pretty}
.why b,.label{display:block;margin-bottom:5px;font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
/* Термин в тексте: пунктир под словом, по нажатию рядом всплывает объяснение */
.tw{all:unset;cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:.06em;text-underline-offset:.16em}
.tw:focus-visible{outline:2.5px solid currentColor;outline-offset:2px}
.tt{position:fixed;z-index:40;max-width:min(320px,calc(100vw - 24px));padding:11px 13px 12px;border-radius:3px;background:var(--ink);color:var(--paper);
  font:400 .9rem/1.42 var(--f-text);box-shadow:0 8px 28px rgb(0 0 0 / .28)}
.tt b{display:block;margin-bottom:3px;font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
/* Без скрипта объяснение термина показывается под словом, когда оно в фокусе */
html:not(.js) .tw{position:relative}
html:not(.js) .tw:focus::after{content:attr(data-def);position:absolute;left:0;top:100%;z-index:5;width:min(280px,70vw);padding:9px 11px;border-radius:3px;
  background:var(--ink);color:var(--paper);font:400 .86rem/1.4 var(--f-text);letter-spacing:0;text-transform:none}
/* Термин, которого в видимом тексте дословно нет, остаётся строкой — объяснение не пропадает */
.terms{margin:0;display:grid;gap:4px;max-width:60ch;font:400 .88rem/1.5 var(--f-text)}
.terms dt{display:inline;font-weight:600}
.terms dd{display:inline;margin:0}
.terms dd::before{content:" — "}
/* Команда — плакат наизнанку: фон цвета текста, текст цвета фона. Подпись видна только у непроверенного промпта */
.term{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 10px;padding:6px 6px 6px 14px;border-radius:3px;background:var(--ink);color:var(--paper)}
.term-bar{display:contents}
.term-bar svg,.term-bar span{display:none}
.term-bar.warn span{display:block;grid-column:1/-1;grid-row:1;padding:4px 0 6px;font:500 .68rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.term-bar.warn span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--alarm)}
.term pre{grid-column:1;grid-row:2;min-width:0;margin:0;overflow-x:auto}
.term code{font:500 .9rem/1.6 var(--f-mono);white-space:pre}
/* Промпт фишки — текст: переносится по ширине, а не уезжает за край экрана телефона */
.term.wrap code{white-space:pre-wrap;overflow-wrap:anywhere}
.term.wrap .copy{grid-column:1/-1;grid-row:3;justify-self:start;margin:6px 0 2px}
.copy{grid-column:2;grid-row:2;min-height:36px;padding:0 12px;border:1.5px solid currentColor;border-radius:3px;background:none;font:600 .76rem var(--f-text);cursor:pointer}
.act{display:flex;align-items:center;flex-wrap:wrap;gap:4px 18px;padding-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border:0;border-radius:3px;background:var(--ink);color:var(--paper);
  font:600 .94rem var(--f-text);text-decoration:none;cursor:pointer}
.lnk{display:inline-flex;align-items:center;min-height:46px;padding:0;border:0;background:none;color:inherit;font:600 .94rem var(--f-text);
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;cursor:pointer}
.lnk.sm{min-height:34px;font:inherit;letter-spacing:inherit;text-transform:inherit}
/* Разбор лежит в разметке закрытым: со скриптом его показывает лист, без скрипта он раскрывается на месте */
.more summary{list-style:none;user-select:none}
.more summary::-webkit-details-marker{display:none}
.more[open]{flex-basis:100%}
.more-body{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:14px;overflow-wrap:anywhere}
.more-body p,.sh-body p{margin:0;font:400 1.03rem/1.55 var(--f-text)}
.vote{margin-left:auto;display:flex;gap:2px}
.vote button{position:relative;width:46px;height:46px;display:grid;place-items:center;border:0;border-radius:3px;background:none;opacity:.75;cursor:pointer}
.vote svg{width:19px;height:19px}
.vote .on{opacity:1}
.vote .on svg{fill:currentColor}
.vote.err{outline:1.5px solid var(--alarm)}
/* Всплеск от «нравится»: два кольца, как у знака сигнала, и восемь искр */
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst b{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border:2px solid var(--mood);border-radius:50%;opacity:0}
.burst i{position:absolute;left:-1.5px;top:-5px;width:3px;height:10px;border-radius:2px;background:var(--mood);opacity:0}

/* Обложка: дата во всю ширину цветом дня, от точки расходятся круги сигнала */
.cover .content{padding-top:12svh}
.rings{position:absolute;z-index:0;right:-38%;top:-16%;width:128%;max-width:880px;color:var(--mood);overflow:visible}
.rings circle{fill:none;stroke:currentColor;stroke-width:.3;opacity:.34}
.rings .dot{fill:currentColor;stroke:none;opacity:1}
.mark{display:inline-flex;align-items:center;gap:8px;font:800 1.5rem/1 var(--f-display);text-transform:lowercase;text-decoration:none}
.mark svg{width:18px;height:18px}
.date{display:flex;align-items:flex-end;gap:.08em;font:900 var(--date-size,clamp(9rem,47vw,24rem))/.76 var(--f-display);letter-spacing:-.025em;color:var(--mood);font-variant-numeric:tabular-nums}
.date small{padding-bottom:.5em;font:500 .74rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);writing-mode:vertical-rl;transform:rotate(180deg)}
.cover .hl,.blk .hl,.end .hl{font-size:clamp(2rem,8.6vw,4.4rem)}

/* Содержание и списки одной строкой: «Ещё за день», «Утром ты пропустил», отсеянное */
.toc,.list{margin:0;padding:0;list-style:none}
.toc a{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:0 6px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.toc .n{font:800 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.toc .t{font:500 1rem/1.3 var(--f-text)}
.toc .k{grid-column:2;margin-top:3px;font:400 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.toc a.read .t{opacity:.5}
.toc a.read .n{opacity:.35}
.list li{padding:11px 0;border-bottom:1px solid var(--line)}
.list li>a:first-child{font:500 1rem/1.3 var(--f-text);text-decoration:none}
.list li>a:first-child:hover,.toc a:hover .t{text-decoration:underline}
.list .k{display:flex;flex-wrap:wrap;gap:0 10px;margin-top:3px;font:400 .68rem/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.try{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.try>a{font:500 1rem/1.3 var(--f-text);text-decoration:none}
.try>a:hover{text-decoration:underline}
.noise ul{margin-top:8px;max-height:60svh;overflow:auto}
.noise .list li>a:first-child{font-size:.9rem;font-weight:400}
.fail{color:var(--alarm)}
/* Без скрипта шапки с названием раздела нет: раздел подписан над своей первой новостью */
html:not(.js) .grp::before{content:attr(data-label);display:block;max-width:1120px;margin-inline:auto;padding:26px 18px 0;
  font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}

/* Лист снизу: разбор новости, хронология сюжета или содержание */
.scrim{position:fixed;inset:0;z-index:19;background:rgb(0 0 0 / .62);opacity:0;transition:opacity .3s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;max-width:720px;max-height:88svh;margin-inline:auto;overflow:hidden;
  border-radius:14px 14px 0 0;background:var(--paper);color:var(--ink);transform:translateY(105%);transition:transform .46s cubic-bezier(.22,1,.36,1);touch-action:none}
.sheet.open{transform:none}
.sheet:focus{outline:none}
.sh-head{position:relative;flex:none;padding:24px 60px 16px 18px;background:var(--ink);color:var(--paper)}
.sh-head::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:currentColor;opacity:.4}
.sh-head h2{margin:6px 0 0;font:800 1.9rem/.93 var(--f-display);text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
#sh-x{position:absolute;right:6px;top:14px;width:48px;height:48px;border:0;background:none;font:400 2rem/1 var(--f-text);cursor:pointer}
.sh-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:16px;overflow:auto;overscroll-behavior:contain;overflow-wrap:anywhere;touch-action:pan-y;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.points{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.points li{display:grid;grid-template-columns:18px minmax(0,1fr);font:400 .98rem/1.5 var(--f-text)}
.points li::before{content:"";width:8px;height:8px;margin-top:.5em;background:var(--mood)}
.more-body .note,.sh-body .note{font:400 .95rem/1.5 var(--f-text);opacity:.85}
.caveat{padding:12px 14px;border:1.5px solid currentColor;font:400 .92rem/1.5 var(--f-text)}
.sh-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-top:10px;border-top:1px solid var(--line)}
.tl{margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 20px 26px}
.tl li::before{content:"";position:absolute;left:0;top:.2em;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.tl li.now::before{border-color:var(--mood);background:var(--mood)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:5px;top:calc(.2em + 15px);bottom:1px;width:2px;background:var(--line)}
.tl time{display:block;font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.tl span{display:block;margin-top:2px;font:500 1rem/1.4 var(--f-text)}
/* Заголовок, летящий из плаката в шапку листа */
.flight{position:fixed;z-index:30;margin:0;pointer-events:none;transform-origin:0 0}

@media (min-width:860px){
  .inner,.hdr-in{max-width:1320px}
  .inner{padding-bottom:30px}
  .content{gap:20px}
  .cols{grid-template-columns:1.15fr .85fr;gap:44px}
  .hl{max-width:21em}
  .toc,.list,.try{max-width:860px}
  .sheet{top:0;left:auto;width:min(600px,46vw);max-height:none;margin:0;border-radius:0;transform:translateX(105%)}
  .sh-head::before{display:none}
  html:not(.js) .grp::before{max-width:1320px}
}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  /* Плакат собирается на подходе к экрану: заголовок открывается шторкой, текст поднимается следом */
  .anim .slide .rv{opacity:0;transform:translateY(16px);transition:opacity .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--d,0) * 40ms)}
  .anim .slide.in .rv{opacity:1;transform:none}
  .anim .slide .hl.rv{clip-path:inset(0 0 100% 0);transition:clip-path .55s cubic-bezier(.22,1,.36,1),opacity .3s,transform .55s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--d,0) * 40ms)}
  .anim .slide.in .hl.rv{clip-path:inset(-20% -5% -20% -5%)}
  .tt{animation:tt .18s ease-out}
  @keyframes tt{from{opacity:0;transform:translateY(5px)}}
  #fly span{animation:flyin 1.1s cubic-bezier(.22,1,.36,1) both}
  @keyframes flyin{from{opacity:0;transform:translateX(12%)}}
  .rings circle{animation:ring 4.8s ease-out infinite;animation-delay:calc(var(--i) * .32s)}
  .rings .dot{animation:none}
  @keyframes ring{0%{opacity:.1}10%{opacity:.95}55%{opacity:.16}100%{opacity:.1}}
  /* Выпуск дочитан — по кругам проходит волна */
  .prog.done circle{animation:beat .9s cubic-bezier(.3,1.5,.5,1) calc(var(--i) * 70ms) both}
  @keyframes beat{40%{stroke-width:2.3;opacity:.55}}
  .vote .on[data-v="up"] svg{animation:thumb .5s cubic-bezier(.3,1.7,.5,1)}
  @keyframes thumb{0%{transform:scale(.7)}35%{transform:scale(1.4) rotate(-20deg)}70%{transform:scale(1.05) rotate(6deg)}}
  .vote .on[data-v="down"] svg{animation:sink .4s ease-out}
  @keyframes sink{40%{transform:translateY(5px) scale(.88)}}
  .burst b{animation:ripple .6s cubic-bezier(.2,.8,.3,1) forwards}
  .burst b+b{animation-delay:.12s}
  @keyframes ripple{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
  .burst i{animation:spark .55s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-12px) scaleY(.3)}100%{opacity:0;transform:rotate(var(--a)) translateY(-36px) scaleY(1)}}
}
</style>
</head>
<body>
<div id="fly" aria-hidden="true"><span>$date</span></div>
<header id="hdr" hidden><button type="button" class="hdr-in" id="hdr-btn" aria-label="Содержание выпуска"><span id="hdr-date"></span><span id="hdr-sec"></span><span class="hdr-r"><span id="hdr-n"></span>$rings</span></button></header>
<main id="deck">
$body
</main>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" tabindex="-1" hidden>
  <div class="sh-head"><div class="label" id="sh-k"></div><h2 id="sh-t"></h2><button type="button" id="sh-x" aria-label="Закрыть">×</button></div>
  <div class="sh-body" id="sh-b"></div>
</div>
<div class="tt" id="tip" role="tooltip" hidden></div>
$script
</body>
</html>
