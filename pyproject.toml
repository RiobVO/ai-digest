[project]
name = "ai-digest"
version = "0.1.0"
requires-python = ">=3.12"
# httpx: свой набор CA-сертификатов (urllib на Windows не проходит SSL arXiv) и пул соединений.
# feedparser: RSS/Atom во всех вариациях; руками через xml.etree это сотни строк крайних случаев.
# tzdata: в Windows нет системной базы часовых поясов, без неё zoneinfo не находит Asia/Tashkent
dependencies = ["httpx>=0.28", "feedparser>=6.0", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
# Линтеры только с патч-обновлениями: шаг Lint стоит перед сборкой, и новый минор с новыми проверками
# сорвал бы выпуск без единой правки кода
dev = ["pytest>=8", "ruff~=0.8.6", "mypy~=1.13.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
files = ["digest"]

# У feedparser нет аннотаций типов и пакета stubs
[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["digest"]

[tool.setuptools.package-data]
digest = ["templates/*.html"]
