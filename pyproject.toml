[project]
name = "ai-digest"
version = "0.1.0"
requires-python = ">=3.12"
# httpx: свой набор CA-сертификатов (urllib на Windows не проходит SSL arXiv) и пул соединений.
# feedparser: RSS/Atom во всех вариациях; руками через xml.etree это сотни строк крайних случаев.
dependencies = ["httpx>=0.28", "feedparser>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["digest"]

[tool.setuptools.package-data]
digest = ["templates/*.html"]
