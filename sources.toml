[digest]
# Алиас сам переезжает на новые flash-версии; закрепить версию — указать, например, "gemini-3.5-flash"
model = "gemini-flash-latest"
audience = "Человек из Узбекистана, который хочет первым знать всё главное в мире ИИ и технологий: крупные релизы, компании, деньги, законы, исследования. Сам разработчик: Python, Telegram-боты, Cloudflare Workers, Claude Code, ИИ-ассистенты для малого бизнеса."

# Порядок важен: при склейке дублей основным остаётся источник, который выше в списке.
# Типы: rss | hf_papers | hn | html. max_age_hours по умолчанию 48.
# alert = true: источник проверяется каждый час на срочные новости (окно — последние часы).
# publisher_in_title: заголовки вида «Заголовок - Издание» (Google News), источником считается издание.

# --- Лаборатории ---
[[source]]
name = "openai"
alert = true
type = "rss"
category = "lab"
url = "https://openai.com/news/rss.xml"

[[source]]
name = "anthropic"
alert = true
type = "html"
category = "lab"
url = "https://www.anthropic.com/news"
link_pattern = "/news/[a-z0-9-]+"
strip_words = ["Announcements", "Policy", "Product", "Research", "Societal Impacts", "Interpretability", "Alignment"]

[[source]]
name = "deepmind"
alert = true
type = "rss"
category = "lab"
url = "https://deepmind.google/blog/rss.xml"

[[source]]
name = "google_ai"
alert = true
type = "rss"
category = "lab"
url = "https://blog.google/technology/ai/rss/"

[[source]]
name = "google_research"
type = "rss"
category = "lab"
url = "https://research.google/blog/rss/"

[[source]]
name = "meta_ai"
alert = true
type = "html"
category = "lab"
url = "https://ai.meta.com/blog/"
link_pattern = "https://ai\\.meta\\.com/blog/[a-z0-9-]+"
strip_words = ["FEATURED", "Open Source", "Research", "ML Applications", "Computer Vision", "Hardware"]

[[source]]
name = "nvidia"
alert = true
type = "rss"
category = "lab"
url = "https://blogs.nvidia.com/feed/"

[[source]]
name = "apple_ml"
type = "rss"
category = "lab"
url = "https://machinelearning.apple.com/rss.xml"
max_age_hours = 72

[[source]]
name = "mistral"
alert = true
type = "rss"
category = "lab"
url = "https://mistral.ai/news/rss"

[[source]]
name = "hf_blog"
type = "rss"
category = "lab"
url = "https://huggingface.co/blog/feed.xml"

# --- Общая повестка: что сегодня обсуждает вся индустрия ---
[[source]]
name = "techmeme"
alert = true
type = "rss"
category = "news"
url = "https://www.techmeme.com/feed.xml"

[[source]]
name = "gnews_ai"
alert = true
type = "rss"
category = "news"
url = "https://news.google.com/rss/search?q=%22artificial+intelligence%22+OR+OpenAI+OR+Anthropic+OR+Nvidia+when:1d&hl=en-US&gl=US&ceid=US:en"
max_age_hours = 30
publisher_in_title = true

# --- Статьи (HF Daily Papers = arXiv, отобранный людьми) ---
[[source]]
name = "hf_papers"
type = "hf_papers"
category = "paper"
url = "https://huggingface.co/api/daily_papers"
min_upvotes = 25

# --- Релизы инструментов ---
[[source]]
name = "gh_vllm"
type = "rss"
category = "release"
url = "https://github.com/vllm-project/vllm/releases.atom"
title_prefix = "vLLM"
max_age_hours = 30
latest_only = true

[[source]]
name = "gh_ollama"
type = "rss"
category = "release"
url = "https://github.com/ollama/ollama/releases.atom"
title_prefix = "Ollama"
max_age_hours = 30
latest_only = true

[[source]]
name = "gh_llama_cpp"
type = "rss"
category = "release"
url = "https://github.com/ggml-org/llama.cpp/releases.atom"
title_prefix = "llama.cpp"
max_age_hours = 30
latest_only = true

[[source]]
name = "gh_transformers"
type = "rss"
category = "release"
url = "https://github.com/huggingface/transformers/releases.atom"
title_prefix = "transformers"
max_age_hours = 30
latest_only = true

# --- Сообщество ---
[[source]]
name = "hn"
alert = true
type = "hn"
category = "community"
url = "https://hn.algolia.com/api/v1/search_by_date"
min_points = 100
max_age_hours = 30
keywords = ["AI", "LLM", "LLMs", "GPT", "Claude", "Gemini", "Llama", "Mistral", "OpenAI", "Anthropic", "DeepMind",
            "Qwen", "DeepSeek", "model", "models", "agent", "agents", "inference", "transformer", "diffusion",
            "fine-tuning", "RAG", "embedding", "embeddings", "Hugging Face", "neural"]

# Громкие технологические истории без фильтра по ИИ: «развитие технологий» шире нейросетей
[[source]]
name = "hn_top"
alert = true
type = "hn"
category = "community"
url = "https://hn.algolia.com/api/v1/search_by_date"
min_points = 400
max_age_hours = 30

[[source]]
name = "r_localllama"
type = "rss"
category = "community"
url = "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day"

