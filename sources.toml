type = "rss"
category = "lab"
url = "https://claude.dev/rss.xml"

# --- Общая повестка: что сегодня обсуждает вся индустрия ---
[[source]]
name = "techmeme"
alert = true
type = "rss"
category = "news"
url = "https://www.techmeme.com/feed.xml"
# Ссылка записи — страница-подборка Techmeme; оригинал статьи берётся из описания
original_link = true

[[source]]
name = "gnews_ai"
alert = true
type = "rss"
category = "news"
# Без названий компаний в запросе: иначе лента приносит в основном их и выпуск перекашивается
url = "https://news.google.com/rss/search?q=%22artificial+intelligence%22+OR+AI+OR+robotics+OR+chips+OR+semiconductor+when:1d&hl=en-US&gl=US&ceid=US:en"
max_age_hours = 30
publisher_in_title = true

# --- Статьи (HF Daily Papers = arXiv, отобранный людьми) ---
[[source]]
name = "hf_papers"
type = "hf_papers"
category = "paper"
url = "https://huggingface.co/api/daily_papers"
min_upvotes = 25

