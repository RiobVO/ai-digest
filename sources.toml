[digest]
# Алиас сам переезжает на новые flash-версии; закрепить версию — указать, например, "gemini-3.5-flash"
model = "gemini-flash-latest"
# Квоты бесплатного ключа — по моделям: у 3.6 Flash свои 20 запросов в день. На ней «Ещё за день» и фишки, чтобы
# не тратить квоту 3.8; алиас сейчас ведёт на 3.6. Модель помечают устаревшей: когда её отключат, цепочка уйдёт на Lite
extras_model = "gemini-3.5-flash"
# Своя дневная квота (500 запросов): отсев срочных и последний запас всех вызовов, когда Flash недоступен
lite_model = "gemini-3.5-flash-lite"
audience = "Человек из Ташкента с образованием по ИИ, шарит в программировании: Python, Telegram-боты, Cloudflare Workers, Claude Code, ИИ-ассистенты для малого бизнеса. Хочет первым знать всё главное в мире ИИ и технологий: крупные релизы, компании, деньги, законы, исследования."

# Порядок важен: при склейке дублей основным остаётся источник, который выше в списке.
# Типы: rss | hf_papers | hn | html. max_age_hours по умолчанию 48.
# alert = true: источник проверяется каждый час на срочные новости (окно — последние часы).
# publisher_in_title: заголовки вида «Заголовок - Издание» (Google News), источником считается издание.

# --- Лаборатории ---
[[source]]
name = "openai"
alert = true
type = "rss"
category = "lab"
url = "https://openai.com/news/rss.xml"

[[source]]
name = "anthropic"
alert = true
type = "html"
category = "lab"
url = "https://www.anthropic.com/news"
link_pattern = "/news/[a-z0-9-]+"
strip_words = ["Announcements", "Policy", "Product", "Research", "Societal Impacts", "Interpretability", "Alignment"]

[[source]]
name = "deepmind"
alert = true
type = "rss"
category = "lab"
url = "https://deepmind.google/blog/rss.xml"

[[source]]
name = "google_ai"
alert = true
type = "rss"
category = "lab"
url = "https://blog.google/technology/ai/rss/"

[[source]]
name = "google_research"
type = "rss"
category = "lab"
url = "https://research.google/blog/rss/"

[[source]]
name = "meta_ai"
alert = true
type = "html"
category = "lab"
url = "https://ai.meta.com/blog/"
link_pattern = "https://ai\\.meta\\.com/blog/[a-z0-9-]+"
strip_words = ["FEATURED", "Open Source", "Research", "ML Applications", "Computer Vision", "Hardware"]

[[source]]
name = "nvidia"
alert = true
type = "rss"
category = "lab"
url = "https://blogs.nvidia.com/feed/"

[[source]]
name = "apple_ml"
type = "rss"
category = "lab"
url = "https://machinelearning.apple.com/rss.xml"
max_age_hours = 72

[[source]]
name = "mistral"
alert = true
type = "rss"
category = "lab"
url = "https://mistral.ai/news/rss"

[[source]]
name = "hf_blog"
type = "rss"
category = "lab"
url = "https://huggingface.co/blog/feed.xml"

# --- Практика: источники лайфхаков — настройка агентов и Claude Code из первых рук, с приёмами в самом тексте ---
# Инженерный блог Anthropic: дат на странице нет, посты лежат по адресам /research/…
[[source]]
name = "anthropic_eng"
type = "html"
category = "lab"
url = "https://www.anthropic.com/engineering"
link_pattern = "/research/[A-Za-z0-9-]+"

# Блог команды Claude Code (claude.dev): как они сами настраивают и гоняют агентов
[[source]]
