# --- Сообщество ---
[[source]]
name = "hn"
alert = true
type = "hn"
category = "community"
url = "https://hn.algolia.com/api/v1/search_by_date"
min_points = 100
max_age_hours = 30
keywords = ["AI", "LLM", "LLMs", "GPT", "Claude", "Gemini", "Llama", "Mistral", "OpenAI", "Anthropic", "DeepMind",
            "Qwen", "DeepSeek", "model", "models", "agent", "agents", "inference", "transformer", "diffusion",
            "fine-tuning", "RAG", "embedding", "embeddings", "Hugging Face", "neural"]

