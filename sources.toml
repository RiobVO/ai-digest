alert = true
type = "hn"
category = "community"
url = "https://hn.algolia.com/api/v1/search_by_date"
min_points = 400
max_age_hours = 30

# Show HN — запуски инструментов от авторов. Порог ниже, чем у hn: такие посты набирают меньше очков
[[source]]
name = "hn_show"
type = "hn"
category = "community"
url = "https://hn.algolia.com/api/v1/search_by_date"
tags = "show_hn"
min_points = 50
max_age_hours = 30
keywords = ["AI", "LLM", "LLMs", "GPT", "Claude", "Gemini", "Codex", "Cursor", "MCP", "agent", "agents", "model",
            "models", "prompt", "prompts", "coding", "inference", "RAG"]

# Без авторизации Reddit отдаёт одну ленту, следующая получает 429 и выбивает эту. Поэтому все сабреддиты — одним
# мультиреддитом: топ дня по очкам, большие сабы вытесняют малые (21.10: LocalLLaMA 26, ClaudeAI 23, cursor 1 из 50).
# Категория community: «Скопировать» для Reddit закрыто — чужой промпт, вставленный агенту, исполняется как команда
[[source]]
name = "reddit"
type = "rss"
category = "community"
url = "https://www.reddit.com/r/LocalLLaMA+ClaudeAI+ChatGPTCoding+cursor/top/.rss?t=day&limit=50"

