name: digest

on:
  # Расписания здесь нет: GitHub-cron на этом репозитории часами молчал. Запускает воркер ai-digest-feedback
  # по cron Cloudflare (worker/wrangler.jsonc) через workflow_dispatch
  workflow_dispatch:
    inputs:
      daily:
        description: "Собрать дневной выпуск (повтор в тот же день пересоберёт его из оставшихся новостей)"
        type: boolean
        default: true
      weekly:
        description: "Собрать итог недели (планировщик ставит сам утром в воскресенье)"
        type: boolean
        default: false
      slot:
        description: "Выпуск: morning или evening; пусто — по текущему часу Ташкента"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
      RUN_DAILY: ${{ inputs.daily }}
      WEEKLY_INPUT: ${{ inputs.weekly }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install ".[dev]"

      - name: Test
        run: pytest -q

      - name: Test feedback worker
        run: node --test "worker/test/*.test.js"

      - name: Decide what to build
        id: plan
        run: |
          weekly=false
          if [ "$WEEKLY_INPUT" = "true" ]; then weekly=true; fi
          echo "daily=$RUN_DAILY" >> "$GITHUB_OUTPUT"
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"

      - name: Build digest
        if: steps.plan.outputs.daily == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          # Утро или вечер задаёт планировщик по запланированному времени: опоздавший запуск не сменит выпуск
          ISSUE_SLOT: ${{ inputs.slot }}
        run: python -m digest build

      - name: Build weekly
        if: steps.plan.outputs.weekly == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m digest weekly

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send to Telegram
        if: steps.plan.outputs.daily == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m digest send

      - name: Send weekly to Telegram
        if: steps.plan.outputs.weekly == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m digest send --message weekly.json

      # State коммитим последним: если публикация или отправка упали, новости не помечаются прочитанными
      # и попадут в повторный запуск; state/seen.json и архив страниц живут в репозитории
      - name: Commit state and archive
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "chore(digest): issue $(date -u +%F)"
          # Часовая проверка срочных новостей тоже коммитит state — при обгоне подтягиваем и пробуем снова
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ИИ-дайджест не собрался сегодня. Лог: ${RUN_URL}"
